<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Tools</title>
<meta name="description" content="Nexus Tools: privacy-first browser extensions and data tools.">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#16181d; --muted:#5f6672; --line:#d9dde3; --accent:#1f5fd1; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --panel:#1d2026; --text:#eceef2; --muted:#a2a9b5; --line:#343944; --accent:#6ea0ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.65 system-ui,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin: 16px 0; }
  .card h2 { font-size: 18px; margin: 0 0 4px; }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<main>
  <h1>Nexus Tools</h1>
  <p class="lead">Privacy-first browser extensions and data tools.</p>
  <div class="card">
    <h2>Private PDF Toolkit - Offline</h2>
    <p>Merge, split, organize and edit PDFs in your browser. Your files never leave your device.</p>
    <p><a href="private-pdf/privacy/">Privacy policy</a></p>
  </div>
  <p class="meta">Contact: <a href="mailto:nexusscrapers.dev@gmail.com">nexusscrapers.dev@gmail.com</a></p>
</main>
</body>
</html>
